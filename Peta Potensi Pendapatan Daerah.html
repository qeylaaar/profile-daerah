<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Peta Potensi Pendapatan Daerah · Kota Denpasar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <!-- Leaflet.js CDN (Free & Open Source) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
  :root {
    --bg:#F3F6F8;--surface:#FFFFFF;--surface2:#F4F6F8;--line:#DCE3E8;--line2:#EEF2F4;
    --ink:#14212B;--muted:#4F6170;--muted2:#8C9AA5;
    --nav:#0F2A3D;--nav2:#1B3A52;--nav-ink:#DCE7EE;--nav-muted:#A9BDCB;--nav-active:#17806F;
    --teal:#0B7A6E;--teal-soft:#DDF1EE;--teal-ink:#075A51;
    --orange:#D2601A;--orange-soft:#FDEBDD;--orange-ink:#9A3F0B;
    --blue:#2563B8;--blue-soft:#E1ECFA;--blue-ink:#1F4F8F;
    --purple:#6B44B0;--purple-soft:#EEE7F8;--purple-ink:#4F2F8A;
    --grey-soft:#E9EEF1;--grey-ink:#33475A;
    --map-bg:#EEF2EF;--map-block:#E2E7E4;--road:#FFFFFF;--water:#A8CBE0;--park:#CFE3CC;
    --heat1:#FDF3EA;--heat2:#F9E3CF;--heat3:#F5D6BB;--heat4:#F2C9A6;
    --sur2:#A9C6EE;--sur1:#D6E4F7;--def1:#FBE1CC;--def2:#F4BE92;
    --shadow:0 1px 3px rgba(15,42,61,.16);
    --font:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme:dark) {
    :root:not([data-theme="light"]) {
      --bg:#0D1820;--surface:#15232E;--surface2:#1B2C38;--line:#2A3D4B;--line2:#20313D;
      --ink:#E6EEF3;--muted:#9FB2C0;--muted2:#6E8494;
      --nav:#081620;--nav2:#14283A;--nav-ink:#D2E0EA;--nav-muted:#8FA6B6;--nav-active:#167565;
      --teal:#3FB5A3;--teal-soft:#123A36;--teal-ink:#86DFD1;
      --orange:#F08A4B;--orange-soft:#3D2414;--orange-ink:#F6B58A;
      --blue:#6FA3E8;--blue-soft:#16283F;--blue-ink:#A9C8F2;
      --purple:#A98BE0;--purple-soft:#2A2040;--purple-ink:#CDB9F2;
      --grey-soft:#22323E;--grey-ink:#B8C8D4;
      --map-bg:#18252E;--map-block:#22323C;--road:#34495A;--water:#2B4F66;--park:#22402E;
      --heat1:#2A2520;--heat2:#3A2B1E;--heat3:#4C3220;--heat4:#603A1F;
      --sur2:#2E5689;--sur1:#1E3654;--def1:#4A2E1A;--def2:#6E3F1C;
      --shadow:0 1px 3px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0D1820;--surface:#15232E;--surface2:#1B2C38;--line:#2A3D4B;--line2:#20313D;
    --ink:#E6EEF3;--muted:#9FB2C0;--muted2:#6E8494;
    --nav:#081620;--nav2:#14283A;--nav-ink:#D2E0EA;--nav-muted:#8FA6B6;--nav-active:#167565;
    --teal:#3FB5A3;--teal-soft:#123A36;--teal-ink:#86DFD1;
    --orange:#F08A4B;--orange-soft:#3D2414;--orange-ink:#F6B58A;
    --blue:#6FA3E8;--blue-soft:#16283F;--blue-ink:#A9C8F2;
    --purple:#A98BE0;--purple-soft:#2A2040;--purple-ink:#CDB9F2;
    --grey-soft:#22323E;--grey-ink:#B8C8D4;
    --map-bg:#18252E;--map-block:#22323C;--road:#34495A;--water:#2B4F66;--park:#22402E;
    --heat1:#2A2520;--heat2:#3A2B1E;--heat3:#4C3220;--heat4:#603A1F;
    --sur2:#2E5689;--sur1:#1E3654;--def1:#4A2E1A;--def2:#6E3F1C;
    --shadow:0 1px 3px rgba(0,0,0,.5);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg:#F3F6F8;--surface:#FFFFFF;--surface2:#F4F6F8;--line:#DCE3E8;--line2:#EEF2F4;
    --ink:#14212B;--muted:#4F6170;--muted2:#8C9AA5;
    --nav:#0F2A3D;--nav2:#1B3A52;--nav-ink:#DCE7EE;--nav-muted:#A9BDCB;--nav-active:#17806F;
    --teal:#0B7A6E;--teal-soft:#DDF1EE;--teal-ink:#075A51;
    --orange:#D2601A;--orange-soft:#FDEBDD;--orange-ink:#9A3F0B;
    --blue:#2563B8;--blue-soft:#E1ECFA;--blue-ink:#1F4F8F;
    --purple:#6B44B0;--purple-soft:#EEE7F8;--purple-ink:#4F2F8A;
    --grey-soft:#E9EEF1;--grey-ink:#33475A;
    --map-bg:#EEF2EF;--map-block:#E2E7E4;--road:#FFFFFF;--water:#A8CBE0;--park:#CFE3CC;
    --heat1:#FDF3EA;--heat2:#F9E3CF;--heat3:#F5D6BB;--heat4:#F2C9A6;
    --sur2:#A9C6EE;--sur1:#D6E4F7;--def1:#FBE1CC;--def2:#F4BE92;
    --shadow:0 1px 3px rgba(15,42,61,.16);
    color-scheme: light;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  h1,h2,h3{text-wrap:balance;margin:0}
  a{color:var(--teal)}

  .shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
  .side{background:var(--nav);color:var(--nav-ink);padding:20px 16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;max-height:100%;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:12px;padding:4px 8px;color:#fff;font-weight:800;font-size:13px;line-height:1.2;letter-spacing:.05em}
  .brand small{display:block;font-size:10px;color:var(--teal);letter-spacing:.08em;font-weight:700}

  .navlist{display:flex;flex-direction:column;gap:4px}
  .navlist a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--nav-ink);text-decoration:none;font-weight:500;white-space:nowrap;transition:background .15s}
  .navlist a:hover{background:var(--nav2)}
  .navlist a[aria-current="page"]{background:var(--nav-active);color:#fff;font-weight:700}
  .navlist svg{flex:none}

  /* theme switcher widget */
  .theme-box{background:var(--nav2);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;border:1px solid #28445A}
  .theme-box label{font-size:11px;color:var(--nav-muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  .theme-switch{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#0A1B28;padding:3px;border-radius:6px}
  .theme-btn{background:transparent;border:0;color:var(--nav-muted);font-size:11px;font-weight:600;padding:5px 4px;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;transition:all .15s}
  .theme-btn:hover{color:#fff}
  .theme-btn.active{background:var(--nav-active);color:#fff;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.3)}

  .who{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding:14px 8px 0;border-top:1px solid var(--nav2)}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--nav2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex:none}
  .who b{display:block;color:#fff;font-weight:600;font-size:13px}.who span{font-size:11px;color:var(--nav-muted)}
  .role{width:100%;margin-top:4px;background:var(--nav2);color:var(--nav-ink);border:1px solid #2B4A63;border-radius:8px;padding:7px 10px;min-height:38px}

  main{min-width:0;padding:24px 32px 48px;display:flex;flex-direction:column;gap:20px}
  .head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
  .head h1{font-size:26px;font-weight:800;letter-spacing:-.01em}
  .head p{margin:4px 0 0;color:var(--muted);font-size:13px}
  .titlerow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .badge-ill{background:var(--orange-soft);color:var(--orange-ink);font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 9px;border-radius:999px}
  .badge-city{background:var(--teal-soft);color:var(--teal-ink);font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 9px;border-radius:999px}
  .crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
  .crumb a{text-decoration:none;font-weight:600}

  .banner-kec{background:var(--teal-soft);border:1px solid var(--teal);color:var(--teal-ink);border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .banner-kec b{font-size:15px;font-weight:800}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
  .card h2{font-size:16px;font-weight:700}
  .cardhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .note{font-size:12px;color:var(--muted)}
  .row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
  .row>.w3{flex:3 1 540px;min-width:0}.row>.w2{flex:2 1 340px;min-width:0}.row>.w1{flex:1 1 320px;min-width:0}
  .grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:6px}
  .kpi .l{color:var(--muted);font-weight:600;font-size:13px}
  .kpi .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
  .kpi .s{font-size:12px;color:var(--muted)}
  .up{color:var(--teal-ink);font-weight:700}
  .warn{color:var(--orange-ink)}
  .bar{height:8px;background:var(--grey-soft);border-radius:4px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--teal);border-radius:inherit}
  .tag-map{font-size:11px;font-weight:700;letter-spacing:.06em;color:#fff;background:var(--nav);padding:4px 8px;border-radius:6px}

  .field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
  select,.input{min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:13px;font-weight:500}
  .seg{display:flex;gap:4px;background:var(--grey-soft);padding:4px;border-radius:10px;flex-wrap:wrap}
  .seg button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;min-height:36px;padding:0 14px;border-radius:8px;cursor:pointer;transition:all .15s}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pills button{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:12px;min-height:36px;padding:0 14px;border-radius:999px;cursor:pointer;transition:all .15s}
  .pills button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-ink)}
  .btn{min-height:42px;padding:0 16px;border-radius:8px;font-weight:700;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:13px;transition:all .15s}
  .btn.pri{background:var(--teal);color:#fff}
  :root[data-theme="dark"] .btn.pri{color:#06201C}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#06201C}}
  .btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
  .btn.out{background:var(--surface);color:var(--teal-ink);border-color:var(--teal)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .linkbtn{white-space:nowrap;background:none;border:0;padding:4px 0;color:var(--teal-ink);font-weight:700;cursor:pointer;text-decoration:underline;min-height:32px;font-size:13px}

  .chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
  .chip.teal{background:var(--teal-soft);color:var(--teal-ink)}
  .chip.orange{background:var(--orange-soft);color:var(--orange-ink)}
  .chip.blue{background:var(--blue-soft);color:var(--blue-ink)}
  .chip.purple{background:var(--purple-soft);color:var(--purple-ink)}
  .chip.grey{background:var(--grey-soft);color:var(--grey-ink)}
  .chip.late{background:var(--orange-ink);color:#fff}

  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-size:12px;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
  tr.sel td{background:var(--teal-soft)}
  .num{font-variant-numeric:tabular-nums}
  .sub{font-size:12px;color:var(--muted)}

  /* Leaflet Map Containers */
  .leaflet-map-frame{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
  .leaflet-container{font-family:var(--font);background:var(--bg)}
  .leaflet-popup-content-wrapper{background:var(--surface);color:var(--ink);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.25);border:1px solid var(--line)}
  .leaflet-popup-tip{background:var(--surface)}
  .leaflet-control-zoom a{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--line)!important}

  /* Clean Dark Mode for OpenStreetMap Tiles (100% Free, No Watermark, No API Key) */
  :root[data-theme="dark"] .leaflet-tile-pane {
    filter: brightness(0.65) invert(1) contrast(1.6) hue-rotate(200deg) saturate(0.25);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .leaflet-tile-pane {
      filter: brightness(0.65) invert(1) contrast(1.6) hue-rotate(200deg) saturate(0.25);
    }
  }
  :root[data-theme="light"] .leaflet-tile-pane {
    filter: none !important;
  }

  /* Custom HTML Pins on Leaflet Map */
  .custom-pin-wrap{background:transparent;border:none}
  .leaflet-pin{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px;border:3px solid var(--surface);box-shadow:var(--shadow);cursor:pointer;transition:transform .15s ease}
  .leaflet-pin:hover{transform:scale(1.15)}
  .leaflet-pin.selected{box-shadow:0 0 0 4px var(--ink);transform:scale(1.2)}
  .p-cek{background:var(--orange)}.p-baru{background:var(--purple)}.p-belum{background:#5E6E7A}.p-ok{background:var(--teal)}

  .map-overlay-info{position:absolute;left:12px;bottom:12px;z-index:900;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;gap:5px;font-size:11px;box-shadow:var(--shadow)}
  .map-overlay-info span{display:flex;align-items:center;gap:8px}
  .sw{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
  .legend-row{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);align-items:center}
  .legend-row span{display:flex;align-items:center;gap:6px}
  .ln{width:20px;height:4px;border-radius:2px;display:inline-block}

  .photo{border-radius:10px;overflow:hidden;border:1px solid var(--line);position:relative;background:var(--map-block)}
  .photo .cap{position:absolute;left:8px;bottom:8px;background:var(--nav);color:#fff;font-size:11px;padding:3px 8px;border-radius:4px}
  .ph{aspect-ratio:4/3;max-width:100%;border-radius:8px;background:var(--map-block);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:var(--muted);font-weight:600}
  dl.kv{margin:0;display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:13px}
  dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;font-weight:600}

  .tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .tier{border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line)}
  .tier .t{font-size:11px;font-weight:700;letter-spacing:.06em}
  .tier .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
  .tier p{margin:0;font-size:12px;color:var(--muted)}
  .tier .c{font-size:11px;font-weight:700}
  .tier.pot{background:var(--surface2)}.tier.pot .t,.tier.pot .c{color:var(--muted)}
  .tier.est{background:var(--blue-soft)}.tier.est .t,.tier.est .c{color:var(--blue-ink)}
  .tier.act{background:var(--teal-soft)}.tier.act .t,.tier.act .c{color:var(--teal-ink)}

  .catrow{display:grid;grid-template-columns:84px 1fr 80px;align-items:center;gap:12px}
  .prio{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--line2);border-radius:8px;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;transition:background .15s}
  .prio:hover,.prio.on{background:var(--surface2)}
  .sq{width:32px;height:32px;border-radius:8px;background:var(--nav);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-size:11px}
  .big{font-size:20px;font-weight:800;color:var(--orange-ink);font-variant-numeric:tabular-nums}

  .flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
  .flow div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
  .flow div.hl{background:var(--nav);color:#fff;border-color:var(--nav)}
  .flow .k{font-size:10px;font-weight:700;letter-spacing:.06em;opacity:.8}
  .flow .n{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  .flow .u{font-size:11px;opacity:.85}
  .steps{display:flex;flex-direction:column}
  .step{display:flex;gap:12px;align-items:center;padding:6px 0}
  .step i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:800;color:#fff}
  .step.done i{background:var(--teal);border-color:var(--teal)}
  .step.now i{border-color:var(--orange)}.step.now{font-weight:700}
  .step.todo{color:var(--muted)}
  .search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:0 12px;min-height:40px;background:var(--surface);color:var(--muted)}
  .search input{border:0;outline:none;background:transparent;width:170px;min-width:0;font-size:13px}

  .timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
  .timeline li{display:grid;grid-template-columns:95px 12px 1fr;gap:10px}
  .timeline .d{font-size:12px;color:var(--muted)}
  .timeline .b{width:10px;height:10px;border-radius:50%;margin-top:4px}
  .tree{list-style:none;margin:0 0 0 16px;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .tree li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:var(--surface2)}
  .tree li.me{background:var(--teal-soft)}
  .parent{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--nav);color:#fff;border-radius:8px}
  .mini{background:var(--surface2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px}
  .mini .v{font-size:20px;font-weight:800}
  .occ{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:120px}
  .occ div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:11px}
  .occ b{width:100%;max-width:40px;border-radius:4px 4px 0 0;display:block}

  /* Komoditas */
  .bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end;height:240px;border-bottom:1px solid var(--line);padding:0 6px}
  .bars>div{display:flex;justify-content:center;align-items:flex-end;gap:6px;height:100%}
  .bars .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;width:38%;font-size:11px;font-weight:700}
  .bars .stack{width:100%;display:flex;flex-direction:column}

  .gps{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:12px;align-items:center}
  .err{color:var(--orange-ink);font-size:12px;font-weight:600}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--nav);color:#fff;padding:12px 20px;border-radius:8px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:9999;max-width:calc(100% - 32px);font-size:13px}
  .foot{font-size:12px;color:var(--muted);margin:0}

function initDashboardMap(){
  const container = document.getElementById('dashMap');
  if(!container) return;

  const f = S.kec;
  const isKecView = (f !== 'all' && KECAMATAN_DATA[f]);

  dashMap = L.map('dashMap', {
    center: isKecView ? KECAMATAN_DATA[f].center : DENPASAR_CENTER,
    zoom: isKecView ? KECAMATAN_DATA[f].zoom : DENPASAR_ZOOM,
    zoomControl: true,
    scrollWheelZoom: true
  });

  dashTileLayer = L.tileLayer(OSM_TILE_URL, {
    maxZoom: 19,
    attribution: OSM_ATTRIBUTION
  }).addTo(dashMap);

  // Render 4 Kecamatan Polygons with click-to-redirect
  Object.keys(KECAMATAN_DATA).forEach(k => {
    const kd = KECAMATAN_DATA[k];
    const isSelected = (f === k);
    const isDimmed = (isKecView && !isSelected);

    const poly = L.polygon(kd.coords, {
      color: isSelected ? '#17806F' : (isDimmed ? '#8C9AA5' : '#0B7A6E'),
      weight: isSelected ? 4 : 2,
      fillColor: kd.fillColor,
      fillOpacity: isSelected ? 0.45 : (isDimmed ? 0.08 : 0.25),
      dashArray: isSelected ? null : '4 4'
    }).addTo(dashMap);

    poly.bindTooltip(`
      <div style="font-family:var(--font);padding:2px">
        <b style="font-size:13px">${kd.name}</b><br>
        <span style="font-size:11px;color:#0B7A6E">Potensi: <b>${kd.potensi}</b> &bull; Temuan: <b>${kd.open}</b></span><br>
        <small style="color:#555">&rarr; Klik untuk masuk detail kecamatan</small>
      </div>
    `, {sticky: true});

    // Clicking polygon zooms in & redirects to this kecamatan!
    poly.on('click', () => {
      if (S.kec === k) {
        // Toggle back to all if already clicked
        go('dashboard', 'all');
      } else {
        go('dashboard', k);
      }
    });

    dashKecLayers[k] = poly;
  });

  // Render Object Markers (filtered by kecamatan if selected)
  S.objects.forEach(o => {
    if (isKecView && o.kec !== f) return;

    const marker = L.marker([o.lat, o.lng], {
      icon: makePinIcon(o.sh, o.s, false),
      title: `${o.id} - ${o.type}`
    }).addTo(dashMap);

    marker.bindPopup(`
      <div style="min-width:200px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <b style="font-size:14px;color:var(--teal)">${o.id}</b>
          ${chip(o.s)}
        </div>
        <div style="font-weight:700;font-size:13px">${o.type}</div>
        <div class="sub" style="margin:4px 0 8px">${o.road}, ${o.kec}</div>
        <div style="font-size:11px;color:var(--muted)">GPS: ${o.lat.toFixed(4)}, ${o.lng.toFixed(4)}</div>
        <div style="margin-top:10px">
          <a href="#objek/${o.id}" class="linkbtn">Lihat Profil Objek &rarr;</a>
        </div>
      </div>
    `);
  });

  // Smooth fit bounds if kecamatan is selected
  if (isKecView && dashKecLayers[f]) {
    dashMap.fitBounds(dashKecLayers[f].getBounds(), { padding: [25, 25] });
  }
}

function initPenyisiranMap(){
  const container = document.getElementById('penyisiranMap');
  if(!container) return;

  penyisiranMap = L.map('penyisiranMap', {
    center: [-8.668, 115.210],
    zoom: 13,
    zoomControl: true,
    scrollWheelZoom: true
  });

  penyisiranTileLayer = L.tileLayer(OSM_TILE_URL, {
    maxZoom: 19,
    attribution: OSM_ATTRIBUTION
  }).addTo(penyisiranMap);

  // Render Denpasar Road Segments
  DENPASAR_SEGMENTS.forEach(seg => {
    let color = 'var(--muted2)', weight = 5, dash = '6 6';
    if(seg.status === 'sdone') { color = '#0B7A6E'; weight = 6; dash = null; }
    else if(seg.status === 'spart') { color = '#D2601A'; weight = 6; dash = null; }
    else if(seg.status === 'srun') { color = '#2563B8'; weight = 5; dash = null; }

    const poly = L.polyline(seg.coords, {
      color: color,
      weight: weight,
      dashArray: dash,
      opacity: 0.85
    }).addTo(penyisiranMap);

    poly.bindTooltip(`<b>${seg.id}</b>: ${seg.name}<br>${seg.done}/${seg.total} objek diperiksa`, {sticky: true});
  });

  // Render Object Pins
  const objs = S.objects.filter(o => S.pinFilter === 'all' || o.cat === S.pinFilter);
  penyisiranPins = {};

  objs.forEach(o => {
    const isSel = (o.id === S.pinSel);
    const marker = L.marker([o.lat, o.lng], {
      icon: makePinIcon(o.sh, o.s, isSel),
      zIndexOffset: isSel ? 1000 : 0
    }).addTo(penyisiranMap);

    marker.on('click', () => {
      S.pinSel = o.id;
      render();
    });

    penyisiranPins[o.id] = marker;
  });

  const cur = S.objects.find(o => o.id === S.pinSel);
  if(cur) {
    penyisiranMap.panTo([cur.lat, cur.lng]);
  }
}

function initKomoditasMap(){
  const container = document.getElementById('komoditasMap');
  if(!container) return;

  komoditasMap = L.map('komoditasMap', {
    center: DENPASAR_CENTER,
    zoom: 12,
    zoomControl: true,
    scrollWheelZoom: true
  });

  komoditasTileLayer = L.tileLayer(OSM_TILE_URL, {
    maxZoom: 19,
    attribution: OSM_ATTRIBUTION
  }).addTo(komoditasMap);

  const c = KOM[S.kom];
  const KECS = ['Denpasar Barat', 'Denpasar Selatan', 'Denpasar Timur', 'Denpasar Utara'];

  KECS.forEach((k, idx) => {
    const kd = KECAMATAN_DATA[k];
    const diff = c.p[idx] - c.k[idx];
    const isSurplus = diff >= 0;
    const color = isSurplus ? '#0B7A6E' : '#D2601A';

    const poly = L.polygon(kd.coords, {
      color: color,
      weight: 2,
      fillColor: color,
      fillOpacity: isSurplus ? 0.3 : 0.25
    }).addTo(komoditasMap);

    poly.bindTooltip(`<b>${k}</b><br>${isSurplus ? 'Surplus' : 'Defisit'}: ${fmt(Math.abs(diff))} ton/bln`, {permanent: true, direction: 'center', className: 'map-tag'});
  });

  c.recs.forEach(r => {
    const fromK = KECAMATAN_DATA[r[0]], toK = KECAMATAN_DATA[r[1]];
    if(fromK && toK) {
      const line = L.polyline([fromK.center, toK.center], {
        color: 'var(--ink)',
        weight: 3,
        dashArray: '6 6',
        opacity: 0.9
      }).addTo(komoditasMap);

      line.bindTooltip(`Arus Pasokan: ${r[2]} t/bln`, {sticky: true});
    }
  });
}

/* ---------- ROUTING & RENDER ENGINE ---------- */
const VIEWS = {
  dashboard: vDashboard,
  penyisiran: vPenyisiran,
  objek: vObjek,
  tindaklanjut: vTindak,
  komoditas: vKomoditas,
  survei: vSurvei
};

const nav = document.getElementById('nav');
const view = document.getElementById('view');

function renderNav(){
  nav.innerHTML = PAGES.map(p => `
    <a href="#${p[0]}" ${S.page === p[0] ? 'aria-current="page"' : ''}>
      ${svg(ICON[p[0]])}
      <span>${p[1]}</span>
    </a>
  `).join('');
}

function render(keepFocus){
  let fid = null, pos = null;
  if (keepFocus) {
    const a = document.activeElement;
    if (a && a.id) { fid = a.id; pos = a.selectionStart; }
  }

  cleanupMaps();
  view.innerHTML = VIEWS[S.page](S.routeParam);
  renderNav();

  if (S.page === 'dashboard') {
    setTimeout(initDashboardMap, 50);
  } else if (S.page === 'penyisiran') {
    setTimeout(initPenyisiranMap, 50);
  } else if (S.page === 'komoditas') {
    setTimeout(initKomoditasMap, 50);
  }

  if (fid) {
    const el = document.getElementById(fid);
    if (el) {
      el.focus();
      try { el.setSelectionRange(pos, pos); } catch(e){}
    }
  }
}

function go(p, param, scroll){
  if (!VIEWS[p]) p = 'dashboard';
  S.page = p;
  S.routeParam = param || null;
  if (p === 'dashboard') {
    S.kec = (param && KECAMATAN_DATA[param]) ? param : 'all';
  }
  render();
  if (scroll !== false) {
    window.scrollTo(0, 0);
    view.focus({preventScroll:true});
  }
}

function fromHash(){
  const raw = (location.hash || '').replace('#', '');
  const parts = raw.split('/');
  const p = parts[0] || 'dashboard';
  let param = parts[1] || null;
  if (param) param = decodeURIComponent(param);
  go(VIEWS[p] ? p : 'dashboard', param);
}

window.addEventListener('hashchange', fromHash);

/* ---------- EVENT LISTENERS ---------- */
document.addEventListener('click', e => {
  const tBtn = e.target.closest('.theme-btn');
  if (tBtn) {
    applyTheme(tBtn.dataset.themeVal);
    return;
  }

  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act, k = t.dataset.k;

  if (a === 'drillKec') {
    if (k === 'all') {
      location.hash = 'dashboard';
    } else {
      location.hash = 'dashboard/' + encodeURIComponent(k);
    }
  } else if (a === 'pinf') {
    S.pinFilter = k;
    render();
  } else if (a === 'verify') {
    const o = S.objects.find(o => o.id === S.pinSel);
    if(o) {
      o.s = 'ok';
      o.match = 'Diverifikasi Bapenda Denpasar';
      toast(o.id + ' berhasil diverifikasi');
      render();
    }
  } else if (a === 'schedule') {
    toast('Kunjungan verifikasi ulang dijadwalkan untuk ' + S.pinSel);
  } else if (a === 'dup') {
    toast(S.pinSel + ' dikirim ke sistem untuk pemeriksaan duplikasi');
  } else if (a === 'tltab') {
    S.tlTab = k;
    render();
  } else if (a === 'tlsel') {
    S.tlSel = k;
    render();
  } else if (a === 'advance') {
    const d = S.findings.find(d => d.id === S.tlSel);
    if (d) {
      if (d.s === 'ver') {
        d.s = 'tl';
        toast(d.id + ': verifikasi disetujui, diteruskan ke petugas');
      } else if (d.s === 'tl' || d.s === 'late') {
        d.s = 'done';
        d.res = 'Diselesaikan · penerimaan kasda tertaut';
        toast(d.id + ' ditandai selesai');
      }
      render();
    }
  } else if (a === 'evidence') {
    const d = S.findings.find(d => d.id === S.tlSel);
    if (d) {
      d.ev++;
      toast('Bukti foto lapangan ditambahkan ke ' + d.id);
      render();
    }
  } else if (a === 'kom') {
    S.kom = k;
    render();
  } else if (a === 'svcat') {
    S.svCat = k;
    S.svErr = '';
    render();
  } else if (a === 'toast') {
    toast(t.dataset.msg);
  }
});

document.addEventListener('input', e => {
  if (e.target.dataset.act === 'tlq') {
    S.tlQuery = e.target.value;
    render(true);
  }
});

document.addEventListener('change', e => {
  if (e.target.dataset.act === 'kec') {
    if (e.target.value === 'all') {
      location.hash = 'dashboard';
    } else {
      location.hash = 'dashboard/' + encodeURIComponent(e.target.value);
    }
  }
  if (e.target.dataset.act === 'pickObj') {
    location.hash = 'objek/' + e.target.value;
  }
  if (e.target.id === 'svPhoto' && e.target.files.length) {
    toast('Foto terlampir: ' + e.target.files[0].name);
  }
});

document.addEventListener('submit', e => {
  if (e.target.id !== 'svForm') return;
  e.preventDefault();
  const name = document.getElementById('svName').value.trim();
  if (!name) {
    S.svErr = 'Isi nama atau keterangan objek sebelum mengirim.';
    render();
    document.getElementById('svName').focus();
    return;
  }
  S.svErr = '';
  const id = 'TL-' + S.nextTL++;
  
  S.findings.unshift({
    id: id,
    obj: name,
    oid: 'Baru',
    kec: 'Denpasar Barat',
    kind: SV[S.svCat].label + ' baru dari penyisiran',
    team: 'Tim A',
    due: '12 Okt 2026',
    ev: 2,
    s: 'ver',
    res: '—',
    fresh: true
  });

  S.objects.unshift({
    id: 'OBJ-' + (100 + S.nextTL),
    sh: SV[S.svCat].label.charAt(0),
    cat: S.svCat,
    type: SV[S.svCat].label + ' · ' + name,
    s: 'baru',
    lat: -8.6750 + (Math.random() * 0.006 - 0.003),
    lng: 115.2040 + (Math.random() * 0.006 - 0.003),
    road: 'Jl. Teuku Umar Barat',
    seg: 'U-07',
    kec: 'Denpasar Barat',
    team: 'Tim A',
    time: 'Baru saja',
    k1: SV[S.svCat].l[0][0],
    v1: document.getElementById('sv1') ? document.getElementById('sv1').value : '-',
    k2: SV[S.svCat].l[1][0],
    v2: document.getElementById('sv2') ? document.getElementById('sv2').value : '-',
    match: 'Menunggu verifikasi'
  });

  S.svSent++;
  if (S.svDone < 9) S.svDone++;
  S.tlSel = id;
  toast(id + ' terkirim dan masuk antrean verifikasi Bapenda');
  render();
});

document.getElementById('roleSel').addEventListener('change', e => {
  const o = e.target.selectedOptions[0];
  document.getElementById('avatar').textContent = o.value;
  document.getElementById('roleName').textContent = o.textContent.split('(')[0].trim();
  const home = { PM:'dashboard', VR:'penyisiran', PT:'survei', KP:'tindaklanjut', EK:'komoditas' }[o.value];
  if (location.hash === '#' + home) go(home); else location.hash = home;
});

// Initialize theme
applyTheme(currentThemeMode);

// Initialize router
fromHash();
})();
</script>
